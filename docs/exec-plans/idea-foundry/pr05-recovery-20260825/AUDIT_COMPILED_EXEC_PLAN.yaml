contracts:
  PR05-R1:
    schema: audit-compiled-pr/v1
    pr_id: PR05-R1
    title: Public resume admission and immutable transition planning
    risk_class: critical_research_integrity
    base_sha: 9ddd3471904f2200f4656cb102886c994bd7bed0
    branch: agent/idea-foundry-pr05-r1-public-resume
    commit_message: 'fix(foundry): make public resume plan-before-mutate'
    objective:
      statement: Make run_campaign with resume=true use one immutable fully validated ResumePlan before any durable mutation.
      observable_success: A valid FAILED campaign resumes through the public API, appends one retry, preserves prior attempt values, and can complete successfully; every rejected resume leaves every pre-existing run-root byte unchanged.
    non_goals:
      - no P0b-C2 terminal closure
      - no analysis lineage or meta-analysis change
      - no scientific run, result, receipt, or claim promotion
      - no hostile filesystem/Git/security hardening
    scope:
      allowed_paths:
        - quartz/idea_foundry/resume.py
        - quartz/idea_foundry/sequential.py
        - tests/test_idea_foundry_resume.py
      forbidden_paths:
        - configs/idea_foundry.studies.v1.json
        - quartz/idea_foundry/studies.py
        - docs/idea_foundry/evidence/**
        - docs/idea_foundry/receipts/**
        - results/**
        - src/**
      forbidden_changes:
        - do not alter scientific estimands, tolerances, or historical outputs
        - do not mark P0B-C1 established
        - do not accept helper-only tests as public resume coverage
        - do not mutate state or summary to record a resume rejection
        - do not rewrite or delete prior attempt dictionaries
    current_code_anchors:
      - path: quartz/idea_foundry/sequential.py
        symbols: [run_campaign, _save_state, _validate_state, _validated_attempt, _run_attempt]
        locate: "rg -n '^def (run_campaign|_save_state|_validate_state|_validated_attempt|_run_attempt)\\b' quartz/idea_foundry/sequential.py"
      - path: quartz/idea_foundry/campaign_state.py
        symbols: [CampaignState, AttemptState, plan_initial_campaign_state, validate_campaign_state]
      - path: quartz/idea_foundry/execution_identity.py
        symbols: [ExecutionIdentity, capture_execution_identity]
    preconditions:
      - id: PRE-BASE
        command: 'test "$(git rev-parse HEAD)" = "9ddd3471904f2200f4656cb102886c994bd7bed0"'
        expect: exit=0
      - id: PRE-CLEAN
        command: 'test -z "$(git status --porcelain=v1)"'
        expect: exit=0
      - id: PRE-BASELINE
        command: "./venv/bin/python -m pytest -q tests/test_idea_foundry_campaign_state.py tests/test_idea_foundry_axis_workflows.py -k 'campaign_state or resume or sequential'"
        expect: accepted PR04 selected nodes pass; record exact counts
      - id: PRE-FROZEN
        command: sha256sum configs/idea_foundry.studies.v1.json quartz/idea_foundry/studies.py
        expect: record and preserve both hashes
    required_interface:
      module: quartz/idea_foundry/resume.py
      classes:
        ResumeError: RuntimeError
        RetryAttemptPlan:
          fields: [axis_index:int, axis_id:str, attempt_number:int, output_dir:str, stdout:str, stderr:str]
        ResumePlan:
          fields: [schema_version:int, run_id:str, seed:int, source_state_sha256:str, terminal_prefix_axis_ids:tuple[str], retry:RetryAttemptPlan, next_state:CampaignState]
      functions:
        - 'plan_resume(*, run_root: Path, state_bytes: bytes, identity: ExecutionIdentity, captured_axes_payload: bytes, captured_lab_payload: bytes, run_id: str, seed: int) -> ResumePlan'
        - 'apply_resume_plan(*, state_path: Path, plan: ResumePlan) -> CampaignState'
    behavioral_contract:
      - plan_resume is pure with respect to run_root
      - only inactive FAILED campaigns are eligible
      - every terminal-prefix successful or skipped artifact is validated before next_state construction
      - registry metadata derives from captured bytes, never live load_workflow_specs
      - next_state sets campaign RUNNING and resumed_at, marks only validated terminal-prefix rows verified_skip, changes the failed axis to RUNNING, removes axis failure_reason, and appends one active retry
      - prior attempt dictionaries compare equal to source values
      - apply_resume_plan uses one trusted-local single-writer lock, rechecks source-state SHA-256, validates next_state, and atomically publishes once
      - stale or duplicate plan fails before replacement
      - public run_campaign uses plan_resume then apply_resume_plan with no alternate inline resume transition
      - run loop launches the already-appended retry without adding another attempt
    ordered_steps:
      - write public failing tests first
      - run new tests and require behavior-specific RED
      - create resume.py with frozen dataclasses and pure planning
      - refactor only public resume branch in sequential.py
      - run targeted tests and fix implementation without weakening assertions
      - perform mutation proof: fixed PASS, old defect FAIL, restored PASS
      - run Ruff, diff, scope, and frozen-file checks
      - write evidence bundle, commit once, push, stop for fresh review
    verification:
      targeted:
        - './venv/bin/python -m pytest -q tests/test_idea_foundry_resume.py'
        - "./venv/bin/python -m pytest -q tests/test_idea_foundry_campaign_state.py tests/test_idea_foundry_axis_workflows.py -k 'campaign_state or resume or sequential'"
      negative_cases: [invalid prior artifact, RUNNING campaign, SUCCESS campaign, legacy schema, identity drift, stale duplicate plan]
      regression_cases: [failed-to-success retry, stale failure_reason removal, public API plan/apply, rejected resume byte identity]
      static:
        - './venv/bin/ruff check quartz/idea_foundry/resume.py quartz/idea_foundry/sequential.py tests/test_idea_foundry_resume.py'
        - './venv/bin/ruff format --check quartz/idea_foundry/resume.py quartz/idea_foundry/sequential.py tests/test_idea_foundry_resume.py'
        - git diff --check
        - 'git diff --name-only 9ddd3471904f2200f4656cb102886c994bd7bed0...HEAD'
      full_suite_required: false
      full_suite_reason: focused public resume and accepted dependency map are bounded; broad gate is PR05-R3
    completion_evidence:
      required: [base_sha, final_sha, branch, clean_status, diff_name_status, diff_stat, diff_check, exact command logs, invariant results, mutation results, frozen hashes before and after, skipped gate reasons, unresolved blockers]
      fixed_values:
        scientific_runs_executed: false
        results_or_receipts_created: false
        claim_status_change: none
    review_gate:
      fresh_context_required: true
      implementer_narrative_allowed: false
      pass_condition: {contract_completeness: PASS, P0: 0, P1: 0, evidence_bundle: COMPLETE}

  PR05-R2:
    schema: audit-compiled-pr/v1
    pr_id: PR05-R2
    title: Normalize nested axis process escape
    base_sha_source: accepted_sha_registry.PR05_R1_PUBLIC_RESUME
    on_null: BLOCKED_BY_UNACCEPTED_DEPENDENCY
    branch: agent/idea-foundry-pr05-r2-process-boundary
    commit_message: 'fix(foundry): normalize nested axis process exits'
    scope:
      allowed_paths: [quartz/idea_foundry/axis_workflow.py, tests/test_idea_foundry_process_boundary.py]
      forbidden_paths: [scripts/idea_foundry/a26_nested_contour_exact_lab.py, quartz/idea_foundry/search.py, configs/**, results/**, docs/CLAIM_LEDGER.md]
    objective: Nested SystemExit, including code 0, becomes AxisWorkflowError and public exit 2 with no success artifacts.
    required_interface:
      helper: '_call_nested_axis_runner(runner, *args, **kwargs) -> int'
      rules:
        - catch SystemExit only at nested library boundary
        - SystemExit(0), SystemExit(nonzero), and SystemExit(string) are failures
        - exact integer return required; bool, None, and string are rejected
        - outermost CLI convention remains unchanged
        - production code is generic, not A26-specific
    required_tests:
      - test_run_axis_gate_converts_system_exit_zero_to_controlled_failure
      - test_axis_main_returns_two_and_writes_no_success_artifacts_after_nested_exit
      - test_nested_runner_rejects_non_integer_and_bool_status
      - test_process_boundary_is_generic_for_A01_and_A26
    verification:
      - './venv/bin/python -m pytest -q tests/test_idea_foundry_process_boundary.py'
      - "./venv/bin/python -m pytest -q tests/test_idea_foundry_axis_workflows.py -k 'axis_script or a26 or nested_contour'"
      - './venv/bin/ruff check quartz/idea_foundry/axis_workflow.py tests/test_idea_foundry_process_boundary.py'
      - './venv/bin/ruff format --check quartz/idea_foundry/axis_workflow.py tests/test_idea_foundry_process_boundary.py'
      - git diff --check
    mutation_regression: remove SystemExit catch, require named regression FAIL, restore and PASS
    review_gate: {fresh_context_required: true, P0: 0, P1: 0, evidence_bundle: COMPLETE}

  PR05-R3:
    schema: audit-compiled-pr/v1
    pr_id: PR05-R3
    title: P0b-C1 closeout evidence and fresh-context review gate
    base_sha_source: accepted_sha_registry.PR05_R2_PROCESS_BOUNDARY
    on_null: BLOCKED_BY_UNACCEPTED_DEPENDENCY
    branch: agent/idea-foundry-pr05-r3-closeout
    commit_message: 'chore(foundry): add P0b-C1 executable closeout gates'
    scope:
      allowed_paths:
        - schemas/audit_compiled_pr.v1.schema.json
        - schemas/evidence_bundle.v1.schema.json
        - schemas/fresh_review_result.v1.schema.json
        - scripts/verify_audit_compiled_pr.py
        - scripts/verify_evidence_bundle.py
        - tests/test_audit_compiled_contracts.py
        - docs/quality/P0_P1_POLICY.md
        - AGENTS.md
      forbidden_paths: [quartz/idea_foundry/**, src/**, configs/**, results/**, docs/CLAIM_LEDGER.md]
    objective: P0b-C1 acceptance depends on a schema-valid evidence bundle and a verdict-only fresh-context review of the exact SHA/diff.
    invariants:
      - evidence is exact-SHA-bound and complete
      - every declared P0/P1 has test, assertion, or STOP coverage
      - reviewer receives no implementer reasoning and changes no code in first pass
      - P0b-C1 closeout cannot change scientific effect or promotion
    verification:
      focused:
        - './venv/bin/python -m pytest -q tests/test_audit_compiled_contracts.py tests/test_idea_foundry_resume.py tests/test_idea_foundry_process_boundary.py'
        - './venv/bin/python -m pytest -q tests/test_idea_foundry_campaign_state.py tests/test_idea_foundry_resume.py tests/test_idea_foundry_process_boundary.py tests/test_idea_foundry_axis_workflows.py'
      static:
        - changed-file Ruff check and format check
        - git diff --check
    closeout_required: [schema-valid R1 evidence, schema-valid R2 evidence, fresh reviewer result, contract_completeness=PASS, P0=0, P1=0]
    allowed_final_recommendation: [ESTABLISHED_CONTRACT_ONLY, BLOCKED]

post_pr05_dag:
  - id: PR06-R1
    title: Terminal raw-artifact closure
    depends_on: PR05-R3 accepted
    produces: [RawArtifactRecord, TerminalExecutionManifest, close_terminal_campaign]
    p0_invariants:
      - success cannot close without every expected raw artifact
      - failed or incomplete campaign cannot emit successful terminal manifest
      - closure never rewrites prior attempts
      - actual file bytes and hashes are inventoried
    tests: [complete success, missing artifact, stale running attempt, failed/negative preservation, idempotent identical closure and drift rejection]
  - id: PR06-R2
    title: Analysis identity and transformation lineage
    depends_on: PR06-R1 accepted
    produces: [AnalysisIdentity, TransformationManifest, validate_transformation_manifest]
    p0_invariants:
      - no hybrid execution inputs
      - analysis source identity is separate
      - raw member list is explicit
      - changed transformation source invalidates current analysis identity
  - id: PR06-R3
    title: EffectRecordV2 and meta-analysis admission
    depends_on: PR06-R2 accepted
    required_fields: [axis_id, estimand_id, estimand_version, effect_scale, reference_id, unit, higher_is_better, run_id, independent_group_id, independent_member_ids, independent_members_sha256, effect, uncertainty_kind, standard_error, evidence_maturity, claim_scope, dataset_lineage_id, controller_identity, source_artifact_path, source_artifact_sha256]
    small_k_policy: {k1: INSUFFICIENT, k2_to_4: DESCRIPTIVE_ONLY_NO_RANDOM_CI, k5_plus: INFERENTIAL_ELIGIBLE_IF_DESIGN_COMPATIBLE}
    p0_invariants:
      - contract and diagnostic records cannot enter inferential pool
      - changed estimand meaning requires a new version
      - exact properties never use zero-width sampling CI
      - resource-frontier and fixed-compute effects are incompatible
  - id: SCI-V2-REGISTRY
    depends_on: PR06-R3 accepted
    priority_order: [A01, A15, A19, A13, A16]
    execution_authorized: false
    frozen_paths: [configs/idea_foundry.studies.v1.json, quartz/idea_foundry/studies.py]
  - id: SCI-A01
    sequence: [predictor identity and grouped calibration, treatment-delivery telemetry, resource-frontier study, fixed-compute reinvestment and family-generalization NI]
  - id: SCI-A15
    estimand: same_gpu_scheduler_log_throughput_gain_v2
    reference: best fixed CUDA inflight=1 selected on calibration rows
    candidate: latency-constrained schedule selected on disjoint calibration rows
    independent_unit: heldout workload family x repetition block
  - id: SCI-A19
    v1: proxy_screen_v1 frozen and inconclusive
    v2: heldout_joint_loss_v2 with untouched trajectory/family holdout
  - id: SCI-A13
    arms: [adaptive VL incumbent, fixed VL mechanistic control, pending-aware WU-UCT]
    endpoints: [wall-clock throughput, duplicate dispatch, virtual-value pessimism, decision-quality NI]
  - id: SCI-A16
    architecture: immutable eval cache keyed by state+checkpoint+evaluator+ruleset+encoding+schema; parent edge N/W/Q remains parent-specific
    comparison: [no sharing, eval-only sharing, existing full TT]
  - id: COMBINATION-STUDIES
    entry: at least two solo axes qualified
    cells: [baseline, A_only, B_only, A_plus_B]
    contrast: Y_AB - Y_A - Y_B + Y_0
    prohibition: exploratory joint dominance is not formal interaction

scientific_claim_audit:
  global_verdict:
    PR00_PR04: CONTRACT_ONLY_NO_SCIENTIFIC_EFFECT
    PR05: STOP_INVALID
    historical_26axis_factorial: QUARANTINED_HISTORICAL_DIAGNOSTIC
    prospective_science: BLOCKED_UNTIL_PR06_R3
  claims:
    - id: SCI-SYN-001
      subject: Bernoulli kg_rank_risk screen
      verdict: MECHANISM_CANDIDATE_ONLY
      allowed: candidate for real MCTS study
      forbidden: [neural-MCTS efficacy, CPU efficiency, play strength, universal dominance]
    - id: SCI-SYN-002
      subject: candidate morphology widening
      observation: omission regret moved but zero CI-separated total-regret improvements
      verdict: LITERAL_MECHANISM_MOVES_NET_VALUE_NOT_EARNED
      forbidden: [play improvement, net-regret improvement]
    - id: SCI-SYN-003
      subject: H1 synthetic discrimination
      verdict: SIGNAL_EXISTENCE_ONLY
      forbidden: [online calibration, compute saving, quality preservation]
    - id: SCI-SYN-004
      subject: symmetry orbit lab
      verdict: VALID_FOR_TESTED_PYTHON_OPERATORS_ONLY
      forbidden: [full Rust engine agnosticism, neural-network equivariance]
    - id: SCI-SYS-001
      subject: adaptive virtual loss duplication rationale
      observation: real engine adaptive duplicate rate 0.218 versus fixed 0.129; pessimism reduced about sixfold
      verdict: DUPLICATION_RATIONALE_KILLED
      allowed: tested pessimism-reduction rationale only
    - id: SCI-SYS-002
      subject: historical service curve
      observation: representative RTX 3080 Ti workload showed about +23.7 percent throughput over best inflight=1 cell
      verdict: HARDWARE_AND_WORKLOAD_SPECIFIC_DIAGNOSTIC
      forbidden: [shipped-network scheduler efficacy, current hardware optimum, play strength]
    - id: SCI-S7-001
      subject: KG-stop
      observation: 2 halts across 480 cells and maximum 0.6 percent budget saved
      verdict: LOW_BUDGET_LANE_CLOSED
    - id: SCI-S7-002
      subject: H1 versus P_flip calibration
      observation: H1 ECE 0.080 and Brier 0.143 versus P_flip-confidence ECE 0.504 and Brier 0.446; matched-budget comparison insufficient
      verdict: H1_SIGNAL_PREFERRED_PFLIP_NOT_CALIBRATED
    - id: SCI-S7-003
      subject: H3/O6
      observation: 0 of 288 triggers; effect unmeasurable
      verdict: NO_EFFECT_ESTIMATE
    - id: SCI-S7-004
      subject: B13 finite-N readout
      observation: reported KL deltas -0.0297 [-0.033,-0.026] and -0.0104 [-0.0115,-0.0093] with decision ties
      verdict: PROMISING_DECISION_NEUTRAL_KL_SIGNAL_REPLICATION_REQUIRED
      forbidden: [play-strength gain, decision improvement]
    - id: SCI-HIST-001
      subject: historical 26-axis run
      verdict: NO_USABLE_PROSPECTIVE_EFFECTS
    - id: SCI-HIST-FACTORIAL-001
      subject: historical A01 resource-frontier factorial
      observation: 960 games; 42.06 versus 58.24 NN evaluations per move; -27.78 percent
      verdict: COMPUTE_MECHANISM_OBSERVED_QUALITY_AND_INTERACTION_NOT_ESTABLISHED
      forbidden: [quality NI, held-out generalization, interaction equivalence, fixed-compute efficacy, promotion]
    - id: SCI-A15-V2
      verdict: ELIGIBLE_AFTER_PR06_R3
      requirement: actual checkpoint workload, same-GPU v2 estimand, disjoint calibration/evaluation
    - id: SCI-A19-V2
      verdict: NO_CURRENT_EFFICACY
      requirement: freeze v1 proxy and use untouched trajectory/family holdout
    - id: SCI-A13-V2
      verdict: REAL_ENGINE_DIFFERENTIAL_REQUIRED
      requirement: adaptive incumbent, fixed control, WU-UCT treatment
    - id: SCI-A16-V2
      verdict: SEMANTIC_DECOMPOSITION_REQUIRED
      requirement: immutable evaluator cache separated from mutable search statistics
    - id: SCI-A01-V2
      verdict: HIGHEST_PRIORITY_AFTER_LINEAGE
      requirement: versioned predictors, grouped calibration, resource-frontier and fixed-compute lanes, family-generalization NI
    - id: SCI-A18-BOUNDARY
      verdict: STATE_DISJOINT_IS_NOT_TRAJECTORY_GENERALIZATION

fresh_review_contract:
  fresh_context_required: true
  implementer_narrative_allowed: false
  reviewer_changed_code: false
  reviewer_inputs: [base_sha, final_sha, base_to_final_diff, selected_contract, p0_p1_catalogue, invariant_matrix, evidence_bundle, exact_command_logs]
  first_pass: verdict_only
  required_finding_fields: [severity, exact_path_and_anchor, violated_invariant, reproducer, impact, required_fix]
  contract_completeness_questions:
    - What public input or state bypasses all negative tests?
    - What transition is unrepresented?
    - What scientific result could be wrong while tests pass?
    - What legacy behavior is relied on but not pinned?
    - Does helper-only coverage leave public API untested?
    - Does a failure path mutate evidence before eligibility is proven?
  pass_condition: {contract_completeness: PASS, evidence_bundle: COMPLETE, P0: 0, P1: 0}
  repair_policy:
    reviewer_fixes_code: false
    maximum_repairs: 1
    recheck_context: fresh
    permanent_absorption: [regression test, invariant, assertion or STOP gate, reviewer checklist]

evidence_bundle_contract:
  schema: evidence-bundle/v1
  required_fields:
    - pr_id
    - base_sha
    - final_sha
    - branch
    - git_status_porcelain
    - git_diff_name_status
    - git_diff_stat
    - git_diff_check
    - commands_with_exit_stdout_stderr
    - invariant_results
    - mutation_regression_results
    - frozen_file_hashes_before_after
    - skipped_gate_reasons
    - unresolved_blockers
    - scientific_runs_executed
    - results_or_receipts_created
    - claim_status_change
  fixed_values:
    scientific_runs_executed: false
    results_or_receipts_created: false
    claim_status_change: none
