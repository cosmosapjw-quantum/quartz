trust_model:
  mode: trusted_local_single_developer_research
  security_hardening: out_of_scope
  deliberate_tamper_resistance: out_of_scope
  accidental_corruption_detection: required
  scientific_reproducibility: required
  claim_firewall: required

current_status:
  PR00_PR04: ACCEPTED_CONTRACT_ONLY_PROGRESS
  PR05_previous_attempt: STOP_INVALID
  A26_process_escape: UNRESOLVED_REGRESSION
  P0B_C1: NOT_ESTABLISHED
