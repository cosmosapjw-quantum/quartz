  conflicting_authority_action: BLOCKED_BY_CONFLICTING_AUTHORITIES
  missing_reference_action: BLOCKED_BY_MISSING_REFERENCE
  baseline_failure_action: BLOCKED_BY_BASELINE_FAILURE
  scope_violation_action: BLOCKED_BY_SCOPE_VIOLATION
