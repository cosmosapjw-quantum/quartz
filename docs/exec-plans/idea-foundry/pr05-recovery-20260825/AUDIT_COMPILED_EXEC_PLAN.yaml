severity_policy:
  P0: Can silently change a scientific conclusion, mutate or misidentify primary evidence, accept an invalid execution as success, or promote an unsupported claim.
  P1: Can produce a major incomplete implementation, omit a required boundary, accept a stale fallback path, or leave evidence insufficient for independent acceptance.
  P2: Important maintainability or bounded edge-case issue that does not independently invalidate the work unit.
  P3: Minor clarity or non-blocking cleanup.

out_of_scope_security_failures:
  - malicious same-UID writer
  - hostile Git configuration
  - attacker-controlled symlink or mount substitution
  - cryptographic anti-tamper custody
  - multi-tenant authorization

p0_p1_catalogue:
  - id: P0-EXEC-001
    severity: P0
    title: Rejected resume mutates prior evidence
    trigger: Any resume validation failure changes campaign_state.json, campaign_summary.json, attempt metadata, logs, timestamps, or prior artifacts.
    impact: The failure path destroys the forensic state needed to reproduce the prior run.
    required_detection:
      - tests/test_idea_foundry_resume.py::test_public_resume_rejection_is_byte_identical_for_invalid_prior_artifact
      - tests/test_idea_foundry_resume.py::test_public_resume_rejection_is_byte_identical_for_terminal_running_legacy_and_identity_drift
    permanent_guard: Public resume constructs a complete immutable plan before the first durable mutation.
  - id: P0-EXEC-002
    severity: P0
    title: State derives from live rereads rather than captured inputs
    trigger: Registry or config bytes change after identity capture and changed live bytes influence state or resume.
    impact: Execution identity and treatment semantics diverge.
    required_detection:
      - tests/test_idea_foundry_resume.py::test_public_resume_uses_captured_registry_bytes_only
      - tests/test_idea_foundry_campaign_state.py::test_initial_state_uses_captured_registry_bytes_only
    permanent_guard: State and resume plans consume captured blobs/specs passed as values and never call live load_workflow_specs.
  - id: P0-EXEC-003
    severity: P0
    title: Retry rewrites history or produces an invalid state
    trigger: A failed-to-successful retry rewrites attempt 1, retains stale failure_reason in RUNNING or SUCCESS, or writes a state rejected by its own validator.
    impact: Attempt lineage and completion status are false.
    required_detection:
      - tests/test_idea_foundry_resume.py::test_public_resume_failed_to_success_preserves_attempt_history
      - tests/test_idea_foundry_resume.py::test_retry_running_and_success_states_pass_canonical_validation
    permanent_guard: Attempt history is append-only; stale axis failure state is cleared on transition out of FAILED; every state is validated before publication.
  - id: P0-EXEC-004
    severity: P0
    title: Nested SystemExit escapes or is treated as success
    trigger: A library-level axis runner raises SystemExit, including SystemExit(0), and the owner process exits or records success.
    impact: Missing or partial axis output can be accepted as successful.
    required_detection:
      - tests/test_idea_foundry_process_boundary.py::test_run_axis_gate_converts_system_exit_zero_to_controlled_failure
      - tests/test_idea_foundry_process_boundary.py::test_axis_main_returns_two_and_writes_no_success_artifacts_after_nested_exit
    permanent_guard: Only the outermost CLI may raise SystemExit; nested run functions return integer status or raise domain exceptions.
  - id: P0-LIN-001
    severity: P0
    title: Hybrid execution and analysis lineage is accepted
    trigger: Derived analysis combines raw inputs or source identities from different executions without a transformation manifest.
    impact: A numerical result is attributed to the wrong source, config, or input state.
    required_detection:
      - tests/test_idea_foundry_lineage.py::test_hybrid_execution_inputs_are_rejected
      - tests/test_idea_foundry_lineage.py::test_analysis_identity_requires_exact_raw_manifest_link
    permanent_guard: Separate ExecutionIdentity and AnalysisIdentity with a hash-bound TransformationManifest.
  - id: P0-SCI-001
    severity: P0
    title: Contract or provenance pass is promoted to scientific evidence
    trigger: A contract gate, preflight, receipt, or execution-identity pass changes an axis effect, evidence maturity, or claim status.
    impact: Unsupported efficacy or play-strength claim.
    required_detection:
      - tests/test_idea_foundry_scientific_effects.py::test_contract_only_records_cannot_enter_scientific_pool
      - claim-ledger diff gate permits maturity changes only in an authorized scientific evidence PR
    permanent_guard: Execution, contract, effect, maturity, and promotion remain independent fields.
  - id: P0-SCI-002
    severity: P0
    title: Resource-frontier saving is relabeled as fixed-compute efficacy or quality non-inferiority
    trigger: Historical 42.06 versus 58.24 NN-evals per move is used to assert quality preservation, fixed-compute gain, interaction, or generalization.
    impact: Wrong scientific conclusion from unequal realized compute and unclosed lineage.
    required_detection:
      - tests/test_idea_foundry_scientific_effects.py::test_resource_frontier_effect_cannot_satisfy_fixed_compute_claim
      - STOP_SCI_HISTORICAL_FACTORIAL
    permanent_guard: Historical factorial remains descriptive; prospective fixed-compute reinvestment and crossed family-generalization NI are required.
  - id: P0-SCI-003
    severity: P0
    title: Dependent observations are treated as independent units
    trigger: Seeds, openings, repetitions, checkpoints, or repeated states sharing lineage are counted as independent without member lists.
    impact: Pseudo-replication and false significance.
    required_detection:
      - tests/test_idea_foundry_scientific_effects.py::test_independent_group_requires_explicit_unique_members
      - tests/test_idea_foundry_combination_studies.py::test_four_arm_blocks_preserve_shared_unit_membership
    permanent_guard: Every effect record carries independent_member_ids and a membership hash; nested levels are explicit.
  - id: P0-SCI-004
    severity: P0
    title: Estimand meaning changes without a version bump
    trigger: A15 CUDA/CPU ratio becomes same-GPU scheduler gain, or A19 proxy score becomes held-out loss, under the old estimand ID/version.
    impact: Incompatible effects can be pooled as if identical.
    required_detection:
      - tests/test_idea_foundry_scientific_studies.py::test_changed_estimand_semantics_require_new_version
      - tests/test_idea_foundry_scientific_effects.py::test_estimand_versions_never_pool
    permanent_guard: Freeze v1 meanings and create v2 registry/modules.
  - id: P1-API-001
    severity: P1
    title: Internal helper passes while the public API violates the contract
    trigger: Tests exercise plan_resume or apply_resume_plan but not run_campaign with resume=True and the CLI.
    impact: The accepted entry point bypasses validated logic.
    required_detection:
      - tests/test_idea_foundry_resume.py::test_public_run_campaign_resume_uses_resume_plan
      - tests/test_idea_foundry_resume.py::test_cli_resume_and_python_api_share_the_same_transition
    permanent_guard: Public entrypoint tests are mandatory; helper-only tests never close a work unit.
  - id: P1-PROC-001
    severity: P1
    title: Partial implementation is marked complete
    trigger: A helper exists but the public path, negative matrix, or evidence bundle is absent.
    impact: Later PRs build on an unclosed boundary.
    required_detection:
      - completion evidence contains public positive, public negative, and public regression nodes
      - fresh reviewer checks all observable postconditions
    permanent_guard: Status remains PARTIAL until every contract row passes.
  - id: P1-TEST-001
    severity: P1
    title: Regression test does not prove detection of the original defect
    trigger: A new test passes on fixed code but is never shown to fail when the defect is reintroduced.
    impact: The test can be vacuous or overfit.
    required_detection:
      - evidence bundle contains fixed PASS, mutation FAIL, restored PASS for each P0 regression
    permanent_guard: Mutation-backed red-green evidence is mandatory for P0/P1 regressions.
  - id: P1-EVID-001
    severity: P1
    title: Completion evidence is incomplete or not final-SHA-bound
    trigger: Missing base/final SHA, dirty status, command outputs, exit codes, skipped-gate reason, or diff.
    impact: Independent acceptance cannot be reproduced.
    required_detection:
      - PR05-R3 evidence verifier rejects absent fields and SHA mismatch
    permanent_guard: No acceptance without a schema-valid evidence bundle.
  - id: P1-META-001
    severity: P1
    title: Small-k random-effects output is treated as inferential
    trigger: k less than 5 produces or is counted as inferential random-effects evidence.
    impact: Overconfident pooled effect.
    required_detection:
      - tests/test_idea_foundry_meta_analysis.py::test_k_two_to_four_is_descriptive_only
      - tests/test_idea_foundry_meta_analysis.py::test_pooled_group_count_counts_only_k_at_least_five
    permanent_guard: k=1 insufficient; k=2..4 descriptive only; k>=5 eligible only if design-compatible.
  - id: P1-LEGACY-001
    severity: P1
    title: Frozen schema-v1 scientific path is edited or resumed
    trigger: configs/idea_foundry.studies.v1.json, quartz/idea_foundry/studies.py, or historical 2026-08 artifacts are modified for prospective science.
    impact: Historical meanings and quarantined claims are rewritten.
    required_detection:
      - immutable SHA-256 precondition and postcondition in every prospective scientific PR
    permanent_guard: Create v2 successors; v1 is read-only.
  - id: P1-SCI-005
    severity: P1
    title: Synthetic or NOOP mechanism is described as real-engine efficacy
    trigger: A13 duplicate reduction or A16 evaluator-call reduction is promoted without real-engine differential ablation.
    impact: Mechanism smoke is mistaken for system performance.
    required_detection:
      - prospective A13/A16 registry requires real_engine=true and quality non-inferiority endpoint
    permanent_guard: Synthetic gates generate candidates only.
  - id: P1-SCI-006
    severity: P1
    title: Hardware/model-specific service curve is generalized to production
    trigger: Representative RTX 3080 Ti conv-body result is cited as shipped-network or current-hardware scheduler efficacy.
    impact: Scheduler is tuned to a different workload or machine.
    required_detection:
      - A15 v2 requires model_source, checkpoint_sha256, hardware_runtime_id, and disjoint calibration/evaluation rows
    permanent_guard: Historical service curve remains diagnostic.
  - id: P1-SCI-007
    severity: P1
    title: Poorly calibrated P_flip is called calibrated
    trigger: A01 live P_flip inherits a calibration claim despite Stage-7 evidence and unmatched-budget comparison.
    impact: Over-eager stopping can silently reduce search quality.
    required_detection:
      - A01 v2 requires grouped calibration, wrong-stop upper bound, and fixed-compute quality endpoint
    permanent_guard: Predictor calibration and stopping efficacy are separate gates.
  - id: P1-SCI-008
    severity: P1
    title: State-disjoint holdout is called trajectory-family generalization
    trigger: A18 exact-state disjointness is promoted to held-out game, trajectory, or family evidence.
    impact: Correlated trajectories inflate generalization claims.
    required_detection:
      - A18 v2 requires trajectory_id and family_id disjointness with explicit member audit
    permanent_guard: State-disjoint is diagnostic only.

